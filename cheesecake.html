<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cheesecake</title>
  <link rel="stylesheet" href="menu-grid.css">
  <link rel="stylesheet" href="sidebar-cheesecake.css">
  <link rel="stylesheet" href="bottom-bar.css">
  <style>
    .cheesecake-container {
      max-width: 400px;
      margin: 40px auto 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 24px 18px 32px 18px;
      text-align: center;
    }
    .cheesecake-img {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .cheesecake-options {
      text-align: left;
      margin: 0 auto 20px auto;
      max-width: 320px;
    }
    .cheesecake-options label {
      display: block;
      margin-bottom: 10px;
      font-size: 1.05em;
      cursor: pointer;
    }
    .add-to-cart-btn {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 28px;
      font-size: 1.1em;
      cursor: pointer;
      margin-top: 18px;
      transition: background 0.2s;
    }
    .add-to-cart-btn:hover {
      background: #1256a3;
    }
  </style>
</head>
<body>
  <!-- Sidebar button and sidebar -->
  <button id="openSidebarBtn" onclick="openSidebar()" style="position:fixed;top:18px;right:18px;z-index:1000;">☰ Menu</button>
  <div id="sidebar" style="display:none;">
    <a href="javascript:void(0)" onclick="closeSidebar()" style="font-size:2em;">&times;</a>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
  </div>

  <div class="cheesecake-container">
    <h2>Cheesecake</h2>
    <img src="images/Cheesecake.jpg" alt="Cheesecake" class="cheesecake-img" />
    <div class="item-price" style="font-size:1.2em; margin-bottom: 18px;">DKK 19,-</div>
    <div class="cheesecake-description" style="margin-bottom:18px; color:#444;">
      Classic creamy cheesecake with a buttery biscuit base, made with fresh cream cheese, eggs, sugar, and a hint of vanilla.
    </div>
    <form class="cheesecake-options">
      <strong>Choose your topping:</strong>
      <label>
        <input type="radio" name="topping" value="Strawberry Sauce" checked>
        Strawberry Sauce
      </label>
      <label>
        <input type="radio" name="topping" value="Blueberry Sauce">
        Blueberry Sauce
      </label>
      <label>
        <input type="radio" name="topping" value="Chocolate Drizzle">
        Chocolate Drizzle
      </label>
      <label>
        <input type="radio" name="topping" value="No Topping">
        No Topping
      </label>
      <strong style="display:block; margin-top:18px;">Add-ons:</strong>
      <label>
        <input type="checkbox" name="addon" value="Whipped Cream">
        Whipped Cream (+DKK 3,-)
      </label>
      <label>
        <input type="checkbox" name="addon" value="Fresh Berries">
        Fresh Berries (+DKK 5,-)
      </label>
    </form>
    <a href="menu.html" style="margin-right:16px; color:#1976d2; text-decoration:underline; font-size:1em; vertical-align:middle;">&#8592; Back to Menu</a>
    <button class="add-to-cart-btn">Add to Cart 🛒</button>
  </div>

  <div id="bottom-bar">
    <button class="bottom-bar-item">
      <!-- Optional: <i class="icon-home"></i> -->
    </button>
    <button id="order-button" style="padding: 10px 20px; background-color: #fafafa; color: rgb(0, 0, 0); border: none; border-radius: 5px; cursor: pointer; font-size: 1em;">Bestill</button>
    <span id="cart-details-display">DKK (0.00,-)</span>
    <button class="bottom-bar-item" id="cart-action-button">
      <span id="cart-icon-display">0 🛒</span>
    </button>
    <button class="bottom-bar-item">
      <!-- Optional: <i class="icon-profile"></i> -->
    </button>
  </div>

  <script src="menu-grid.js"></script>
  <script src="cartOverlay.js"></script>
  <script src="orderConfirmationOverlay.js"></script>
  <script src="cart.js"></script>
  <script>
    function openSidebar() {
      document.getElementById('sidebar').style.display = 'block';
    }
    function closeSidebar() {
      document.getElementById('sidebar').style.display = 'none';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
